name: 📃 Readme

on:
  push:
    branches: [main]
    paths:
      - 'templates.json'
      - 'scripts/readme.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  update:
    name: 📃 List the apps
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_BOT: ${{ secrets.BOT_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: bot
        if: env.HAS_BOT == 'true'
        with:
          client-id: Iv23liPIG7E12UlaQMaD
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - run: python3 scripts/readme.py >> "$GITHUB_STEP_SUMMARY"
      - name: Commit it to main
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
        run: |
          if git diff --quiet -- .github/README.md; then
            echo "Nothing's changed since the last update" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base64 -w0 .github/README.md > "$RUNNER_TEMP/readme"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/.github/README.md" \
            -f message='docs: update the list of apps' -f branch=main \
            -f sha="$(git rev-parse HEAD:.github/README.md)" -F content=@"$RUNNER_TEMP/readme" \
            --jq '"✅ Committed [\(.commit.sha[:7])](\(.commit.html_url))"' >> "$GITHUB_STEP_SUMMARY"
