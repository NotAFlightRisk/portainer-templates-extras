name: 📦 Release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      BOT_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: 📦 Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_BOT: ${{ secrets.BOT_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: bot
        if: env.HAS_BOT == 'true'
        with:
          client-id: Iv23liPIG7E12UlaQMaD
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Publish the release with templates.json attached
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" templates.json \
            --title "$TAG" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"
          count=$(jq '.templates | length' templates.json)
          echo "Released $TAG with $count templates" >> "$GITHUB_STEP_SUMMARY"
