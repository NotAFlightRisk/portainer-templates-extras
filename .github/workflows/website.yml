name: 🕸️ Website

on:
  pull_request:
    branches: [website]
  push:
    branches: [website]

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.emoji }} ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: format
            emoji: 🎨
            run: npm run format:check
          - label: types
            emoji: 🔬
            run: npm run check
          - label: tests
            emoji: 🧪
            run: npm test
          - label: build
            emoji: 🏗️
            run: npm run build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.run }}
