services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -c
      - touch /app/server/storage/.env && ln -sf /app/server/storage/.env /app/server/.env && exec /bin/bash /usr/local/bin/docker-entrypoint.sh
    ports:
      - "${ANYTHINGLLM_PORT:-3001}:3001"
    environment:
      STORAGE_DIR: /app/server/storage
      ANYTHINGLLM_CHROMIUM_ARGS: --no-sandbox,--disable-setuid-sandbox
    volumes:
      - anythingllm-storage:/app/server/storage

volumes:
  anythingllm-storage:
