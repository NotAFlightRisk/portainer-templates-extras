services:
  nocobase:
    image: nocobase/nocobase:latest
    restart: unless-stopped
    init: true
    ports:
      - "${NOCOBASE_PORT:-13000}:80"
    environment:
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: nocobase
      DB_USER: nocobase
      DB_PASSWORD: ${NOCOBASE_DB_PASSWORD:?Set a database password}
      INIT_ROOT_PASSWORD: ${NOCOBASE_ADMIN_PASSWORD:?Set a password for the admin account}
    volumes:
      - nocobase-storage:/app/nocobase/storage
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_DB: nocobase
      POSTGRES_USER: nocobase
      POSTGRES_PASSWORD: ${NOCOBASE_DB_PASSWORD:?Set a database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocobase -d nocobase"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nocobase-storage:
  postgres-data:
