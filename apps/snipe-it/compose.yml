services:
  snipeit:
    image: snipe/snipe-it:v8-latest
    restart: unless-stopped
    ports:
      - "${SNIPEIT_PORT:-8300}:80"
    environment:
      APP_URL: ${SNIPEIT_URL:?Set the address you'll open it on}
      APP_KEY: ${SNIPEIT_APP_KEY:?Set an app key}
      APP_TIMEZONE: ${SNIPEIT_TIMEZONE:-UTC}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: snipeit
      DB_USERNAME: snipeit
      DB_PASSWORD: ${SNIPEIT_DB_PASSWORD:?Set a database password}
    volumes:
      - snipeit-data:/var/lib/snipeit
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: snipeit
      MARIADB_USER: snipeit
      MARIADB_PASSWORD: ${SNIPEIT_DB_PASSWORD:?Set a database password}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  snipeit-data:
  db-data:
