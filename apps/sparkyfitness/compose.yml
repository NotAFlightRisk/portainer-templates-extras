services:
  sparkyfitness-frontend:
    image: codewithcj/sparkyfitness:latest
    restart: unless-stopped
    ports:
      - "${SPARKYFITNESS_PORT:-3004}:80"
    environment:
      SPARKY_FITNESS_SERVER_HOST: sparkyfitness-server
      SPARKY_FITNESS_SERVER_PORT: 3010
    depends_on:
      sparkyfitness-server:
        condition: service_healthy

  sparkyfitness-server:
    image: codewithcj/sparkyfitness_server:latest
    restart: unless-stopped
    environment:
      SPARKY_FITNESS_FRONTEND_URL: ${SPARKYFITNESS_URL:?Set the address you'll open it on}
      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${SPARKYFITNESS_ENCRYPTION_KEY:?Set an encryption key}
      BETTER_AUTH_SECRET: ${SPARKYFITNESS_AUTH_SECRET:?Set an auth secret}
      SPARKY_FITNESS_ADMIN_EMAIL: ${SPARKYFITNESS_ADMIN_EMAIL:-}
      SPARKY_FITNESS_DISABLE_SIGNUP: ${SPARKYFITNESS_DISABLE_SIGNUP:-false}
      SPARKY_FITNESS_DB_HOST: sparkyfitness-db
      SPARKY_FITNESS_DB_NAME: sparkyfitness_db
      SPARKY_FITNESS_DB_USER: sparky
      SPARKY_FITNESS_DB_PASSWORD: ${SPARKYFITNESS_DB_PASSWORD:?Set a database password}
    volumes:
      - sparkyfitness-uploads:/app/SparkyFitnessServer/uploads
      - sparkyfitness-backup:/app/SparkyFitnessServer/backup
    healthcheck:
      start_period: 3m
    depends_on:
      sparkyfitness-db:
        condition: service_healthy

  sparkyfitness-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sparkyfitness_db
      POSTGRES_USER: sparky
      POSTGRES_PASSWORD: ${SPARKYFITNESS_DB_PASSWORD:?Set a database password}
    volumes:
      - sparkyfitness-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparky -d sparkyfitness_db"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sparkyfitness-uploads:
  sparkyfitness-backup:
  sparkyfitness-db:
