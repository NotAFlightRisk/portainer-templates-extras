services:
  spliit:
    image: ghcr.io/spliit-app/spliit:latest
    restart: unless-stopped
    ports:
      - "${SPLIIT_PORT:-3800}:3000"
    environment:
      POSTGRES_PRISMA_URL: postgresql://spliit:${SPLIIT_DB_PASSWORD:?Set a database password}@postgres:5432/spliit
      POSTGRES_URL_NON_POOLING: postgresql://spliit:${SPLIIT_DB_PASSWORD:?Set a database password}@postgres:5432/spliit
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spliit
      POSTGRES_USER: spliit
      POSTGRES_PASSWORD: ${SPLIIT_DB_PASSWORD:?Set a database password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spliit -d spliit"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
