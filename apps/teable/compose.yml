services:
  teable:
    image: ghcr.io/teableio/teable:latest
    restart: unless-stopped
    ports:
      - "${TEABLE_PORT:-3500}:3000"
    environment:
      PUBLIC_ORIGIN: ${TEABLE_URL:-http://localhost:3500}
      SECRET_KEY: ${TEABLE_SECRET:?Set a secret key}
      PRISMA_DATABASE_URL: postgresql://teable:${TEABLE_DB_PASSWORD:?Set a database password}@postgres:5432/teable
      TELEMETRY_REPORT_DISABLED: ${TEABLE_TELEMETRY_OFF:-false}
    volumes:
      - teable-data:/app/.assets
      - teable-cache:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teable
      POSTGRES_USER: teable
      POSTGRES_PASSWORD: ${TEABLE_DB_PASSWORD:?Set a database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teable -d teable"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  teable-data:
  teable-cache:
  postgres-data:
