services:
  tolgee:
    image: tolgee/tolgee:latest
    restart: unless-stopped
    ports:
      - "${TOLGEE_PORT:-8085}:8080"
    environment:
      TOLGEE_AUTHENTICATION_ENABLED: "true"
      TOLGEE_AUTHENTICATION_INITIALPASSWORD: ${TOLGEE_ADMIN_PASSWORD:?Set an admin password}
      TOLGEE_AUTHENTICATION_REGISTRATIONSALLOWED: ${TOLGEE_SIGNUPS:-false}
      TOLGEE_TELEMETRY_ENABLED: ${TOLGEE_TELEMETRY:-true}
      TOLGEE_MACHINETRANSLATION_DEEPL_AUTHKEY: ${TOLGEE_DEEPL_KEY:-}
      TOLGEE_POSTGRESAUTOSTART_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tolgee
      SPRING_DATASOURCE_USERNAME: tolgee
      SPRING_DATASOURCE_PASSWORD: ${TOLGEE_DB_PASSWORD:?Set a database password}
    volumes:
      - tolgee-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tolgee
      POSTGRES_USER: tolgee
      POSTGRES_PASSWORD: ${TOLGEE_DB_PASSWORD:?Set a database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tolgee -d tolgee"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tolgee-data:
  postgres-data:
