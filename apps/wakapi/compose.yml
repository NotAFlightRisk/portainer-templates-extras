services:
  wakapi:
    image: ghcr.io/muety/wakapi:2
    restart: unless-stopped
    init: true
    ports:
      - "${WAKAPI_PORT:-3100}:3000"
    environment:
      WAKAPI_PASSWORD_SALT: ${WAKAPI_PASSWORD_SALT:?Set a password salt}
      WAKAPI_COOKIE_KEY: ${WAKAPI_COOKIE_KEY:-}
      WAKAPI_PUBLIC_URL: ${WAKAPI_PUBLIC_URL:-http://localhost:3100}
      WAKAPI_ALLOW_SIGNUP: ${WAKAPI_ALLOW_SIGNUP:-true}
    volumes:
      - wakapi-data:/data

volumes:
  wakapi-data:
